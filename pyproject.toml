[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-term"
dynamic = ["version"]
description = "A command-line interface for Canvas LMS: grades, to-dos, discussions, file downloads, and assignment submission."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Linux-Viking" }]
keywords = ["canvas", "canvas-lms", "instructure", "lms", "cli", "students"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "requests>=2.32",
    "keyring>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.6",
    "black>=24",
    "isort>=5.13",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
canvas-term = "canvas_cli.cli:cli"
# Original command name, kept so existing installs and scripts keep working.
canvas-cli = "canvas_cli.cli:cli"

[project.urls]
Homepage = "https://github.com/Linux-Viking/canvas-term"
Issues = "https://github.com/Linux-Viking/canvas-term/issues"
Source = "https://github.com/Linux-Viking/canvas-term"

[tool.setuptools.dynamic]
version = { attr = "canvas_cli.__version__" }

[tool.setuptools.packages.find]
include = ["canvas_cli*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "I"]
ignore = ["E501"]  # black owns line length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and fake tokens are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
